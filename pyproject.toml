[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dbt/target", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["common", "ingestion", "local", "validation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# SVG markup and texts of the architecture diagrams
"scripts/build_architecture.py" = ["E501"]
