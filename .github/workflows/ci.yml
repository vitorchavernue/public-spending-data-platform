name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Ingest sample -> bronze
        run: make ingest bronze

      - name: dbt build (models + data tests)
        run: make dbt

      - name: Shadow validation (legacy vs new, min 99.5%)
        run: make validate

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-validation-report
          path: validation/reports/latest.md

  # Runs the real Airflow DAG end to end (local mode): every step of the monthly
  # load, in order, exactly as it is orchestrated in production.
  airflow:
    runs-on: ubuntu-latest
    needs: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Airflow (official constraints) and dbt (separate environment)
        run: make airflow-setup PY=python

      - name: DAG integrity tests (local and cloud modes)
        run: python -m pytest -q tests/test_airflow_dag.py tests/test_orchestration_steps.py

      - name: Run the monthly DAG end to end
        run: make airflow-test PY=python

      - name: Upload release summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-release-summary
          path: data/publish/latest_release.json
