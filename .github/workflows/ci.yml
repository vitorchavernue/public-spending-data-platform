name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: make lint

      - name: Unit tests
        run: make test

      - name: Ingest sample -> bronze
        run: make ingest bronze

      - name: dbt build (models + data tests)
        run: make dbt

      - name: Shadow validation (legacy vs new, min 99.5%)
        run: make validate

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-validation-report
          path: validation/reports/latest.md
